<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>

/* Layout: inbox style. Tabs and filters above a list on the left, selected enquiry on the right. */
:root {
  --bg: #f3f7f6;
  --surface: #ffffff;
  --fg: #12312e;
  --muted: #5b7370;
  --line: #d6e3e0;
  --accent: #0f766e;
  --accent-soft: #d9f0ec;
  --accent-fg: #ffffff;
  --route: #b45309;
  --route-soft: #fdecd3;
  --close: #4f5fa8;
  --close-soft: #e3e7f7;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a19; --surface: #152624; --fg: #e4f1ee; --muted: #93b0ab; --line: #28423f;
    --accent: #4fd1c0; --accent-soft: #1b3a36; --accent-fg: #0e1a19;
    --route: #f0b45c; --route-soft: #3a2c14; --close: #a5b2ee; --close-soft: #232a4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a19; --surface: #152624; --fg: #e4f1ee; --muted: #93b0ab; --line: #28423f;
  --accent: #4fd1c0; --accent-soft: #1b3a36; --accent-fg: #0e1a19;
  --route: #f0b45c; --route-soft: #3a2c14; --close: #a5b2ee; --close-soft: #232a4a;
  color-scheme: dark;
}

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.bar { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 16px 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { margin: 0; font-family: var(--font-display); font-size: 20px; color: var(--accent); }
.bar p { margin: 0; color: var(--muted); font-size: 14px; }
.switch { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 44px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; }
.sw[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#h1 { max-width: 440px; margin: 12px auto 24px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
#h2 { margin: 0; }

:root { color-scheme: light; }
[hidden] { display: none !important; }
</style>
</head>

<div class="bar">
  <h1>HappySmile mockups</h1>
  <p>Two screens: what the patient sees after asking to be contacted, and what the front desk sees afterwards.</p>
  <div class="switch" role="group" aria-label="Choose a screen">
    <button class="sw" id="b1" type="button" aria-pressed="true">Screen 1: Patient confirmation</button>
    <button class="sw" id="b2" type="button" aria-pressed="false">Screen 2: Front desk</button>
  </div>
</div>
<div id="h1"></div>
<div id="h2" hidden></div>

.help { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 16px; }
.help p { margin: 0; color: var(--muted); }
.help a { color: var(--accent); font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; }
.note { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
<div class="screen">
<main class="page">
  <div class="brand">HappySmile</div>

  <section class="hero" aria-labelledby="h">
    <h1 id="h">Enquiry received</h1>
    <p class="lead">Our AI assistant will call you within <strong>5 minutes</strong>. Please keep your phone nearby.</p>
  </section>

  <div class="ref">
    <span class="label">Your enquiry number</span>
    <span class="num">HS-20418</span>
  </div>

  <section class="card" aria-labelledby="d">
    <h2 id="d">Your details</h2>
    <div class="row"><span class="k">Name</span><span class="v">Priya Sharma</span></div>
    <div class="row"><span class="k">Phone</span><span class="v">+91 98765 43210</span></div>
    <div class="row"><span class="k">Enquiry</span><span class="v">Braces</span></div>
    <button class="edit" type="button">Edit details</button>
  </section>

  <section class="card" aria-labelledby="p">
    <h2 id="p">Enquiry status</h2>
    <ol class="steps">
      <li class="step done"><span class="dot" aria-hidden="true">&#10003;</span><span class="t">Enquiry submitted</span></li>
      <li class="step next" aria-current="step"><span class="dot" aria-hidden="true">2</span><span class="t">Call initiated</span></li>
      <li class="step future"><span class="dot" aria-hidden="true">3</span><span class="t">Enquiry in review</span><span class="s">Our team reviews your call</span></li>
      <li class="step future"><span class="dot" aria-hidden="true">4</span><span class="t">Enquiry resolved</span></li>
    </ol>
  </section>

  <section class="help" aria-labelledby="hh">
    <p id="hh">Didn't get a call?</p>
    <a href="#request-call">Request a call from our team</a>
  </section>

  <p class="note">Mockup with example details.</p>
</main>
</div>

<style>

.btn.secondary { background: none; color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .row:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

</style>

<script>
function initScreen2(root) {

var TYPE_LABEL = { routing: 'Routing request', appointment: 'Appointment request', close: 'Close request' };
var CALLBACK_TIMES = ['In 15 minutes', 'In 30 minutes', 'In 1 hour', 'Today, 5:00 pm', 'Tomorrow, 10:00 am'];

var data = [
  { id: 'HS-20419', name: 'Rahul Mehta', phone: '+91 98450 11872', enquiry: 'Dental implants', type: 'routing', mins: 4, status: 'open',

  { id: 'HS-20418', name: 'Priya Sharma', phone: '+91 98765 43210', enquiry: 'Braces', type: 'appointment', mins: 7, status: 'open',
    proposed: 'Sat, 12 Dec, 4:00 pm', clinic: 'Indiranagar clinic',
    summary: 'Priya is 24 and wants braces for crowded lower teeth. No pain, no earlier orthodontic treatment. She prefers weekend afternoons. The AI proposed a consultation slot.',
    transcript: [['AI', 'This call is being recorded, and I am an AI assistant from HappySmile. Is this Priya?'], ['Patient', 'Yes, speaking.'], ['AI', 'You asked about braces. Is it for crowding, a gap, or something else?'], ['Patient', 'Crowding in my lower teeth. I have not had braces before.'], ['AI', 'Thank you. A consultation is the next step. Would Saturday afternoon work?'], ['Patient', 'Saturday at 4 would be good.']] },
  { id: 'HS-20420', name: 'Ananya Iyer', phone: '+91 99001 45523', enquiry: 'Teeth whitening', type: 'close', mins: 13, status: 'open',

  { id: 'HS-20417', name: 'Karan Singh', phone: '+91 97411 80246', enquiry: 'Braces', type: 'appointment', mins: 21, status: 'open',

    transcript: [['AI', 'This call is being recorded, and I am an AI assistant from HappySmile. Is this Karan?'], ['Patient', 'Yes. The enquiry is for my daughter, she is 15.'], ['AI', 'Thanks. A parent can come with her to the consultation. Which time suits you?'], ['Patient', 'After 6 on a weekday.'], ['AI', 'Friday at 6 pm is available at the Jayanagar clinic.'], ['Patient', 'That works for now.']] },
  { id: 'HS-20416', name: 'Meera Nair', phone: '+91 98860 20931', enquiry: 'Root canal', type: 'routing', mins: 34, status: 'open',
    reason: 'The patient reported severe pain. Medical advice is outside the AI’s scope.',
    summary: 'Meera has had a throbbing toothache for two days and wants to be seen quickly. The AI did not give medical advice and routed the enquiry.',
    transcript: [['AI', 'This call is being recorded, and I am an AI assistant from HappySmile. Is this Meera?'], ['Patient', 'Yes. My tooth has been hurting badly for two days.'], ['AI', 'I am sorry to hear that. I cannot give medical advice, so I will pass you to our team right away.'], ['Patient', 'Please do. I need to see someone today.']] },

];

var state = { tab: 'open', filter: 'all', sel: 'HS-20419' };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function byId(id) { return data.filter(function (e) { return e.id === id; })[0]; }
function visible() {
  return data.filter(function (e) {
    return e.status === state.tab && (state.filter === 'all' || e.type === state.filter);
  });
}
function openCount() { return data.filter(function (e) { return e.status === 'open'; }).length; }
function resolvedCount() { return data.filter(function (e) { return e.status === 'resolved'; }).length; }
function ago(m) { return m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; }

function renderTabs() {
  var box = root.getElementById('tabs');
  box.textContent = '';
  [['open', 'Open', openCount()], ['resolved', 'Resolved', resolvedCount()]].forEach(function (t) {
    var b = el('button', 'tab');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(state.tab === t[0]));
    b.appendChild(document.createTextNode(t[1]));
    b.appendChild(el('span', 'count', String(t[2])));

    box.appendChild(b);
  });
}
function renderChips() {
  var box = root.getElementById('chips');
  box.textContent = '';
  var inTab = data.filter(function (e) { return e.status === state.tab; });
  [['all', 'All'], ['routing', 'Routing'], ['appointment', 'Appointment'], ['close', 'Close']].forEach(function (c) {
    var n = c[0] === 'all' ? inTab.length : inTab.filter(function (e) { return e.type === c[0]; }).length;
    var b = el('button', 'chip', c[1] + ' ' + n);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(state.filter === c[0]));
    b.addEventListener('click', function () { state.filter = c[0]; selectFirst(); render(); });
    box.appendChild(b);
  });

function selectFirst() {
  var v = visible();
  if (!v.length) { state.sel = null; return; }
  if (!v.some(function (e) { return e.id === state.sel; })) state.sel = v[0].id;
}
function renderRows() {
  var ul = root.getElementById('rows');
  ul.textContent = '';
  var v = visible();
  if (!v.length) { ul.appendChild(el('li', 'empty', 'No enquiries here.')); return; }

    b.addEventListener('click', function () { state.sel = e.id; render(); });
    li.appendChild(b);
    ul.appendChild(li);
  });
}

function resolve(e, patientLine) {
  e.status = 'resolved';
  e.ui = '';
  e.patientSees = patientLine;
  state.tab = 'resolved';
  state.filter = 'all';
  state.sel = e.id;
  render();
}
function mk(label, secondary, fn) {
  var b = el('button', 'btn' + (secondary ? ' secondary' : ''), label);
  b.type = 'button';
  b.addEventListener('click', fn);
  return b;
}
function seesBox(text) {
  var d = el('div', 'patient-sees');
  d.appendChild(el('span', 'k', 'What the patient sees on their status page'));
  d.appendChild(el('span', '', text));
  return d;
}

function renderActions(e, box) {
  if (e.status === 'resolved') {
    box.appendChild(el('p', 'hint', 'This enquiry is resolved.'));
    if (e.patientSees) box.appendChild(seesBox(e.patientSees));
    return;
  }
  if (e.type === 'routing') {
    box.appendChild(el('p', 'reason', e.reason));
    if (e.ui === 'accepted') {
      box.appendChild(seesBox('Our team will contact you.'));
      box.appendChild(el('p', 'hint', 'Call the patient on ' + e.phone + ', then mark the enquiry resolved.'));
      var r = el('div', 'btns');
      r.appendChild(mk('Mark resolved', false, function () { resolve(e, 'Enquiry resolved. Our team has spoken with you.'); }));
      box.appendChild(r);
    } else if (e.ui === 'callback-sent') {
      box.appendChild(seesBox('Our team will call you ' + e.callbackAt.toLowerCase() + '.'));
      box.appendChild(el('p', 'hint', 'Call the patient at the time offered, then mark the enquiry resolved.'));
      var r2 = el('div', 'btns');
      r2.appendChild(mk('Mark resolved', false, function () { resolve(e, 'Enquiry resolved. Our team has spoken with you.'); }));
      box.appendChild(r2);
    } else {
      if (e.ui === 'callback') {
        var f = el('div', 'inline');
        var lab = el('label', '', 'Callback time');
        var sel = document.createElement('select');
        sel.id = 'cb-time-' + e.id;
        CALLBACK_TIMES.forEach(function (t) { var o = el('option', '', t); o.value = t; sel.appendChild(o); });
        lab.appendChild(sel);
        f.appendChild(lab);
        f.appendChild(mk('Send callback time', false, function () { e.callbackAt = sel.value; e.ui = 'callback-sent'; render(); }));
        box.appendChild(f);
      }
      var b = el('div', 'btns');
      b.appendChild(mk('Accept call request', false, function () { e.ui = 'accepted'; render(); }));
      b.appendChild(mk('Offer a callback', true, function () { e.ui = 'callback'; render(); }));
      box.appendChild(b);
      box.appendChild(el('p', 'hint', 'If nobody is free, offer a callback. The patient is told the time.'));
    }
    return;
  }
  if (e.type === 'appointment') {
    box.appendChild(el('p', 'reason', 'Proposed appointment: ' + e.proposed + ', ' + e.clinic + '.'));
    if (e.ui === 'reschedule') {
      var f2 = el('div', 'inline');
      var l1 = el('label', '', 'New date');
      var d = document.createElement('input'); d.type = 'date'; d.id = 'new-date-' + e.id; d.value = '2026-12-13';
      l1.appendChild(d);
      var l2 = el('label', '', 'New time');
      var t = document.createElement('input'); t.type = 'time'; t.id = 'new-time-' + e.id; t.value = '11:00';
      l2.appendChild(t);
      f2.appendChild(l1); f2.appendChild(l2);
      f2.appendChild(mk('Confirmed on call, save', false, function () {
        var dt = new Date(d.value + 'T' + t.value);
        var txt = isNaN(dt) ? 'the new date' : dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + dt.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
        resolve(e, 'Appointment scheduled for ' + txt + '.');
      }));
      box.appendChild(f2);
      box.appendChild(el('p', 'hint', 'Call ' + e.phone + ' to agree the new time. The patient’s status stays at "in review" until you save.'));
    } else {
      var b2 = el('div', 'btns');
      b2.appendChild(mk('Accept appointment', false, function () { resolve(e, 'Appointment scheduled for ' + e.proposed + '.'); }));
      b2.appendChild(mk('Change date and call patient', true, function () { e.ui = 'reschedule'; render(); }));
      box.appendChild(b2);
    }
    return;
  }
  box.appendChild(el('p', 'reason', e.reason));
  if (e.ui === 'calling') {
    box.appendChild(el('p', 'hint', 'Call ' + e.phone + ' to check whether the patient needs anything else. Close the enquiry when you are done.'));
  }
  var b3 = el('div', 'btns');
  b3.appendChild(mk('Close enquiry', false, function () { resolve(e, 'Your question has been answered.'); }));
  if (e.ui !== 'calling') b3.appendChild(mk('Call patient', true, function () { e.ui = 'calling'; render(); }));
  box.appendChild(b3);
}

function renderDetail() {
  var box = root.getElementById('detail');
  box.textContent = '';
  var e = state.sel ? byId(state.sel) : null;
  if (!e) { box.appendChild(el('p', 'empty', 'Select an enquiry to see the details.')); return; }
  var head = el('div', 'dhead');
  var left = el('div');
  left.appendChild(el('h1', '', e.name));
  left.appendChild(el('div', 'sub', 'Enquiry ' + e.id + '  ·  call ' + ago(e.mins)));
  head.appendChild(left);
  head.appendChild(el('span', 'tag ' + (e.status === 'resolved' ? 'resolved' : e.type), e.status === 'resolved' ? 'Resolved' : TYPE_LABEL[e.type]));
  box.appendChild(head);

  var facts = el('div', 'facts');
  [['Phone', e.phone], ['Enquiry', e.enquiry], ['Language', 'English']].forEach(function (p) {
    var f = el('div', 'fact');
    f.appendChild(el('span', 'k', p[0]));
    f.appendChild(el('span', 'v', p[1]));
    facts.appendChild(f);
  });
  box.appendChild(facts);

  var s = el('div');
  s.appendChild(el('h2', '', 'AI summary'));
  s.appendChild(el('p', 'summary', e.summary));
  box.appendChild(s);

  var tr = el('div');
  tr.appendChild(el('h2', '', 'Call transcript'));
  var tb = el('div', 'transcript');
  tb.setAttribute('tabindex', '0');
  tb.setAttribute('role', 'region');
  tb.setAttribute('aria-label', 'Call transcript');
  e.transcript.forEach(function (line) {
    var t = el('div', 'turn' + (line[0] === 'AI' ? ' ai' : ''));
    t.appendChild(el('span', 'who', line[0]));
    t.appendChild(el('span', '', line[1]));
    tb.appendChild(t);
  });
  tr.appendChild(tb);
  box.appendChild(tr);

  var act = el('div', 'actions');
  act.appendChild(el('h2', '', e.status === 'resolved' ? 'Outcome' : 'Your decision'));
  renderActions(e, act);
  box.appendChild(act);
}

function render() { renderTabs(); renderChips(); renderRows(); renderDetail(); }
selectFirst();
render();

}
(function () {
  var h1 = document.getElementById('h1'), h2 = document.getElementById('h2');
  var r1 = h1.attachShadow({ mode: 'open' });
  r1.appendChild(document.getElementById('t1').content.cloneNode(true));
  var r2 = h2.attachShadow({ mode: 'open' });
  r2.appendChild(document.getElementById('t2').content.cloneNode(true));
  initScreen2(r2);
  var b1 = document.getElementById('b1'), b2 = document.getElementById('b2');
  function show(n) {
    h1.hidden = n !== 1; h2.hidden = n !== 2;
    b1.setAttribute('aria-pressed', String(n === 1));
    b2.setAttribute('aria-pressed', String(n === 2));
  }
  b1.addEventListener('click', function () { show(1); });
  b2.addEventListener('click', function () { show(2); });
})();
</script>
</body>
